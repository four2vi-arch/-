<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>돌다리 · 업무 인수인계서</title>
<style>
:root{--bg:#f4f5f7;--card:#fff;--ink:#1c2430;--ink2:#566273;--ink3:#8a94a3;--line:#dfe3ea;--line2:#eef0f4;--accent:#c8102e;--accent-ink:#fff;--accent-soft:#fdecef;--ok:#1f7a4d;--ok-bg:#e6f4ec;--warn:#8a5a00;--warn-bg:#fff3d1;--fail:#b3261e;--fail-bg:#fde7e5;--info:#2d4870;--info-bg:#e4eaf4;--tint:#f3f6fa;--shadow:0 1px 2px rgba(20,30,50,.06),0 4px 14px rgba(20,30,50,.05);--s:1}
:root[data-theme=dark]{--bg:#12161c;--card:#1a2029;--ink:#e8ecf2;--ink2:#9aa6b6;--ink3:#7b8696;--line:#2c3542;--line2:#232b36;--accent:#ff5a6e;--accent-ink:#1a0a0d;--accent-soft:#3a1a20;--ok:#6fd39f;--ok-bg:#15342a;--warn:#f2c35b;--warn-bg:#3a2f12;--fail:#ff8a80;--fail-bg:#3f1c1a;--info:#9cbcea;--info-bg:#17233a;--tint:#202835;--shadow:none}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;font-size:calc(16.5px*var(--s))}
body{margin:0;background:var(--bg);color:var(--ink);font:1rem/1.6 "Pretendard","Malgun Gothic","맑은 고딕","Apple SD Gothic Neo","Noto Sans KR",sans-serif}
h1,h2,h3,h4,p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid #2563eb;outline-offset:2px}
a{color:var(--info)}
.top{background:var(--card);border-bottom:1px solid var(--line);padding:10px 22px;display:flex;align-items:center;gap:14px;position:sticky;top:0;z-index:5;flex-wrap:wrap}
.mark{width:42px;height:42px;border-radius:12px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-weight:800;font-size:1.2rem;flex:none}
.top h1{font-size:1.25rem;letter-spacing:-.02em}.top .sub{color:var(--ink2);font-size:.86rem}
.top .prog{margin-left:auto;display:flex;align-items:center;gap:10px;font-size:.9rem;color:var(--ink2);flex-wrap:wrap}
.bar{height:10px;background:var(--line2);border-radius:5px;overflow:hidden}.bar i{display:block;height:100%;width:0;background:var(--ok);transition:width .3s}
.top .bar{width:160px}
.seg{display:flex;background:var(--line2);border-radius:9px;padding:3px}.seg button{border:0;background:transparent;padding:4px 12px;border-radius:7px;color:var(--ink2);font-size:.88rem;cursor:pointer}.seg button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12);font-weight:600}
.ghost{border:1px solid var(--line);background:var(--card);border-radius:8px;padding:5px 11px;font-size:.9rem;cursor:pointer}.ghost:hover{border-color:var(--ink3)}
.btn{border:1px solid var(--accent);background:var(--accent);color:var(--accent-ink);border-radius:9px;padding:7px 14px;font-weight:600;font-size:.95rem;cursor:pointer}
.btn:disabled,.ghost:disabled{opacity:.45;cursor:default}
.sm{padding:3px 9px;font-size:.84rem}
.layout{display:grid;grid-template-columns:270px minmax(0,1fr) 340px;min-height:calc(100vh - 64px)}
nav{background:var(--card);border-right:1px solid var(--line);padding:14px 12px;position:sticky;top:64px;height:calc(100vh - 64px);overflow:auto}
nav .lbl{font-size:.75rem;color:var(--ink3);letter-spacing:.1em;margin:14px 10px 6px}
nav a{display:flex;align-items:center;gap:8px;padding:6px 10px;border-radius:8px;color:var(--ink2);font-size:.95rem;text-decoration:none;cursor:pointer}
nav a.lv2{padding-left:28px;font-size:.9rem}
nav a.cur{background:var(--accent-soft);color:var(--accent);font-weight:600}
.st{margin-left:auto;font-size:.72rem;padding:1px 7px;border-radius:999px;background:var(--line2);color:var(--ink3);white-space:nowrap}
.st.ok{background:var(--ok-bg);color:var(--ok)}.st.ai{background:var(--info-bg);color:var(--info)}.st.todo{background:var(--warn-bg);color:var(--warn)}
main{padding:24px 32px 80px;max-width:980px}
.crumb{color:var(--ink3);font-size:.85rem;margin-bottom:6px}
main h2{font-size:1.5rem;letter-spacing:-.02em;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.badge{font-size:.78rem;padding:2px 9px;border-radius:999px;font-weight:500}
.badge.ai{background:var(--info-bg);color:var(--info)}.badge.me{background:var(--ok-bg);color:var(--ok)}.badge.todo{background:var(--warn-bg);color:var(--warn)}
.lead{color:var(--ink2);margin:6px 0 18px;font-size:.95rem}
.sec{margin:24px 0}
.sec h3{font-size:1.1rem;margin-bottom:8px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.sec h3 .r{margin-left:auto;display:flex;gap:6px}
.q{background:var(--tint);border:1px solid var(--line2);border-radius:12px;padding:12px 14px;margin:8px 0}
.q .qt{font-weight:600;margin-bottom:6px}
.q textarea,.q input{width:100%;border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:var(--card);min-height:54px;resize:vertical}
.q .ex{font-size:.84rem;color:var(--ink3);margin-top:4px}
.sug{border:1px solid var(--line);border-left:4px solid var(--info);border-radius:10px;padding:10px 12px;margin:8px 0;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 12px;background:var(--card);box-shadow:var(--shadow)}
.sug.me{border-left-color:var(--ok)}.sug.off{opacity:.5;border-left-color:var(--line)}
.sug .t{font-weight:500;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.sug .t input.text{flex:1;min-width:220px;border:1px solid transparent;background:transparent;padding:3px 6px;border-radius:7px}
.sug .t input.text:hover,.sug .t input.text:focus{border-color:var(--line);background:var(--card)}
.sug .s{font-size:.84rem;color:var(--ink3);word-break:break-all}
.sug .act{display:flex;gap:6px;align-items:flex-start;flex-wrap:wrap;justify-content:flex-end}
.sug .act button{border:1px solid var(--line);background:var(--card);border-radius:7px;padding:3px 9px;font-size:.84rem;cursor:pointer}
.sug .act button.y{border-color:var(--ok);color:var(--ok)}.sug .act button.n{color:var(--ink3)}
.sug input.memo{width:100%;border:1px dashed var(--line);border-radius:7px;padding:4px 8px;font-size:.88rem;background:transparent}
.sug select.mini,.sug input.when{padding:3px 6px;font-size:.84rem;border-radius:7px;border:1px solid var(--line);background:var(--card)}
.sug input.when{width:120px}
.chip{font-size:.78rem;padding:1px 8px;border-radius:999px;background:var(--line2);color:var(--ink2);white-space:nowrap}
.chip.cy{background:var(--ok-bg);color:var(--ok)}.chip.st{background:var(--warn-bg);color:var(--warn)}
.cal{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.cal .m{border:1px solid var(--line);border-radius:10px;padding:8px 10px;min-height:70px;font-size:.88rem}
.cal .m b{display:block;margin-bottom:4px;color:var(--ink2)}
.cal .m div{padding:1px 0}
.cal .m.empty{background:var(--tint);color:var(--ink3)}
.people{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:10px}
.person{border:1px solid var(--line);border-radius:10px;padding:10px 12px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 10px}
.person b{font-size:1rem}.person .ph{font-family:Consolas,monospace;font-size:.95rem}.person .why{font-size:.84rem;color:var(--ink3);word-break:break-all}
.person input{border:1px dashed var(--line);border-radius:7px;padding:3px 8px;font-size:.88rem;width:100%;grid-column:1/3;background:transparent}
.person .x{border:0;background:transparent;color:var(--ink3);cursor:pointer;font-size:.9rem}
.files li{margin:4px 0;font-size:.95rem}.files li .s{color:var(--ink3);font-size:.84rem}
aside{background:var(--card);border-left:1px solid var(--line);padding:16px;display:flex;flex-direction:column;gap:12px;position:sticky;top:64px;height:calc(100vh - 64px);overflow:auto}
aside h4{font-size:.95rem;display:flex;gap:8px;align-items:center}
aside input.ask{border:1px solid var(--line);border-radius:10px;padding:8px 10px;font-size:.9rem;background:var(--tint);width:100%}
.ans{border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:.88rem}
.ans .f{font-weight:600;word-break:break-all}.ans .l{color:var(--ink2);font-size:.82rem;word-break:break-all}.ans .src{font-size:.8rem;color:var(--ink3);margin-top:6px}
.check{border:1px solid var(--line);border-radius:10px;padding:8px 12px;font-size:.9rem}
.check div{display:flex;justify-content:space-between;gap:8px;padding:3px 0;border-bottom:1px dotted var(--line2)}
.check .ok{color:var(--ok)}.check .no{color:var(--warn)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:8px 0}
input[type=text],select{padding:7px 10px;border:1px solid var(--line);border-radius:9px;background:var(--card)}
input.wide{flex:1;min-width:240px}
.note{background:var(--warn-bg);border-left:4px solid var(--warn);padding:8px 12px;border-radius:8px;margin:8px 0;font-size:.9rem}
.bad{background:var(--fail-bg);border-left:4px solid var(--fail);padding:8px 12px;border-radius:8px;margin:8px 0;font-size:.9rem}
.good{background:var(--ok-bg);border-left:4px solid var(--ok);padding:8px 12px;border-radius:8px;margin:8px 0;font-size:.9rem}
.pills{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0}.pill{padding:4px 12px;border-radius:999px;background:var(--line2);font-size:.88rem;color:var(--ink2)}.pill b{color:var(--ink)}
.picker{border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin:8px 0;background:var(--tint)}
.picker .d{display:inline-block;margin:3px 6px 3px 0;padding:4px 10px;border:1px solid var(--line);border-radius:7px;background:var(--card);cursor:pointer}
details{margin:8px 0}summary{cursor:pointer;color:var(--info);font-size:.92rem}
table{border-collapse:collapse;width:100%;font-size:.92rem;margin:6px 0}th,td{border-bottom:1px solid var(--line2);padding:6px 8px;text-align:left;vertical-align:top}th{color:var(--ink2);font-weight:600;white-space:nowrap}td.num,th.num{text-align:right}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:10px}
.acard{border:1px solid var(--line);border-radius:12px;padding:12px 14px;cursor:pointer;background:var(--card)}
.acard:hover{border-color:var(--accent)}
.acard h4{font-size:1rem;display:flex;justify-content:space-between;gap:8px}
.acard .cnt{color:var(--ink2);font-size:.86rem;margin-top:4px}
.acard .bar{margin-top:8px}
#log{font-family:Consolas,monospace;font-size:.8rem;color:var(--ink2);white-space:pre-wrap;max-height:260px;overflow:auto;background:var(--tint);padding:8px;border-radius:8px}
#printView{display:none}
@page{margin:15mm}
@media print{.top,nav,aside,main{display:none !important} #printView{display:block;font-size:12.5pt;line-height:1.5;padding:0 4mm} #printView h2{font-size:19pt;margin:0 0 6pt} #printView h3{font-size:15pt;margin:14pt 0 4pt;border-bottom:1px solid #999} #printView h4{font-size:13pt;margin:10pt 0 3pt} #printView p{margin:3pt 0} #printView .pi{padding:3pt 0 3pt 10pt;border-bottom:1px dotted #bbb;break-inside:avoid} #printView .s{display:block;color:#555;font-size:10.5pt;padding-left:10pt} .layout{display:block}}
@media (max-width:1300px){.layout{grid-template-columns:240px minmax(0,1fr)} aside{display:none}}
@media (max-width:860px){.layout{grid-template-columns:1fr} nav{position:static;height:auto} .cal{grid-template-columns:repeat(2,1fr)}}
</style>
</head>
<body>
<div class="top">
  <div class="mark">돌</div>
  <div><h1>돌다리 · 업무 인수인계서 <span id="ver" class="sub" style="font-size:.78rem"></span></h1><div class="sub" id="subline">전임자의 업무 폴더에서 후임자가 알아야 할 것을 업무별로 채웁니다 · 이 PC 안에서만 작동</div></div>
  <div class="prog"><span id="progLbl">완성도 —</span><div class="bar"><i id="progBar"></i></div>
    <div class="seg" id="modeSeg" title="넘기는 사람은 넣고 고치고, 받는 사람은 확인합니다"><button data-m="give" class="on">넘기는 사람</button><button data-m="take">받는 사람</button></div>
    <button class="ghost sm" id="fsdn" title="글자 작게">가−</button><button class="ghost sm" id="fsup" title="글자 크게">가＋</button><button class="ghost sm" id="thm" title="밝기">◐</button><button class="ghost sm" id="btnPrint">인쇄</button><button class="btn" id="btnExport">인수인계서 내려받기</button></div>
</div>
<div class="layout">
<nav id="nav"></nav>
<main id="main"></main>
<aside id="aside">
  <h4>💬 물어보기 <span class="chip">파일 이름·본문 검색 · 이 PC 안</span></h4>
  <input class="ask" id="q" placeholder="예) 계약서, 특별소통, 한결물류" autocomplete="off">
  <div id="answers"></div>
  <h4>✅ 완성도</h4>
  <div class="check" id="checklist"></div>
</aside>
</div>
<div id="printView"></div>
<script src="/app.js"></script>
</body>
</html>
